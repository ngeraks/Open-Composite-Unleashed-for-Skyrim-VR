nexusDescription="[center][color=#ea9999][size=6][b]IMPORTANT!!!!!!![/b][/size][/color]\n<br />[color=#ffff00][b][u]DO NOT SEEK SUPPORT FROM VIRTURAL DESKTOP\n<br />FOR ISSUES WHEN USING OC UNLEASHED!![/u][/b][/color]\n<br />\n<br />They don't have the ability to properly diagnose issues using OC, it is not the way their support structure was set up.\n<br />Any and all bugs or issues must come to me here on this Nexus or you must solve them in your communities. Check the OCUnleashed.log in your SKSE folder [/center]\n<br />[center][size=6][color=#FFB428][b]\n<br />OPENCOMPOSITE[/b][/color] [b][color=#ea9999]UNLEASHED!!![/color][/b][/size]\n<br />[size=4][color=#C0C0C0]for Skyrim VR[/color][/size]\n<br />\n<br />[color=#7EB8DA]Works with  SteamVR  Headsets |  VR Keyboard Anywhere |  Controller Combos  |  Full Rebinding | Integrated Graphics Performance[/color][/center]\n<br />\n<br />[line]\n<br />\n<br />[center][size=5][color=#FFB428][b]~ What Is This? ~[/b][/color][/size][/center]\n<br />\n<br />Open Composite Unleashed is a modified build of the open-source [url=https://github.com/yehorb/OpenComposite]OpenComposite[/url] project that replaces SteamVR with a direct OpenXR connection to your headset. Lower latency, better performance, no middleman.\n<br />\n<br />But the real game-changer is what it adds on top: [color=#FFB428][b]a fully functional VR keyboard you can pull up anywhere in Skyrim VR[/b][/color] \n<br />console commands, enchanting, search fields, MCM menus, you name it. That single feature opens the door to hundreds of mods that were previously unusable in VR because they required text input Skyrim VR never provided.\n<br />\n<br />[line]\n<br />\n<br />[center][size=5][color=#FFB428][b]~ Features ~[/b][/color][/size][/center]\n<br />\n<br />[center][b][color=#a64d79][size=4]DLSS4 &amp; FSR3 OTHER GRAPHICS ENHANCEMENTS[/size]\n<br />[size=4]NOW EASY TO GET WORKING WITH STEAM VR HEADSETS.[/size][/color]\n<br />[/b][b][color=#00bfff][size=4]\n<br />Integrated Graphics and Performance Tools[/size][/color][/b][/center]\n<br />[center][left][list]\n<br />[*][color=#efefef]OCU includes a configurable rendering suite:[/color][/*]\n<br />[*] NVIDIA DLSS Super Resolution and DLAA[/*]\n<br />[*]AMD FidelityFX FSR 3 temporal upscaling and Native AA[/*]\n<br />[*]CAS sharpening[/*]\n<br />[*]BlueSkyDefender post-process antialiasing[/*]\n<br />[*]Automatic or custom texture MIP-bias correction[/*]\n<br />[*]Eye-tracked and fixed Variable Rate Shading[/*]\n<br />[*] Depth-Assisted Positional Approximation (DAPA) [/*]\n<br />[*]DLSS and FSR 3 are mutually exclusive.    [/*]\n<br />[/list][/left]\n<br />[b][color=#00bfff][size=4]Eye-Tracked and Fixed VRS for meta headsets[/size][/color]\n<br />[/b]\n<br />[left][list]\n<br />[*]OCU provides two independent VRS modes:[/*]\n<br />[*]Eye Tracking AUTO: uses live OpenXR gaze data when the headset and active runtime expose it.[/*]\n<br />[*]Fixed VRS: uses a head-centered pattern for headsets without eye tracking or as an explicitly enabled fallback.[/*]\n<br />[*]Eye Tracking AUTO does not silently enable fixed foveation when gaze data is unavailable.[/*]\n<br />[*]Both modes include presets and adjustable full-rate and peripheral radii. Compatibility mode limits coarse shading to help reduce Skyrim terrain, foliage, and texture-mip artifacts. [/*]\n<br />[/list][/left]\n<br />[b][color=#00bfff][size=4]DAPA[/size][/color]\n<br />[color=#00bfff][size=4]DAPA means Depth-Assisted Positional Approximation.[/size][/color]\n<br />[/b]\n<br />[left][b][b][color=#efefef][size=3]It generates synthetic frames using cached color, Skyrim depth, and headset movement. It is not conventional ASW because it does not use complete per-pixel motion vectors or have a headset side requirement.[/size][/color][/b][/b][/left]\n<br />[left][b][color=#efefef][size=3][b][color=#e4e4e7][color=#efefef][size=3]DAPA  should not be combined with ASW, SSW, or another runtime reprojection system.[/size][/color][/color][/b][/size][/color][/b][/left]\n<br />[left][/left]\n<br />[/center]\n<br />[center][size=4][color=#00BFFF][b]VR Keyboard[/b][/color][/size][/center]\n<br />[list]\n<br />[*]Full keyboard overlay pull it up anytime with a button combo (default: double-tap left stick)[/*]\n<br />[*]Works with Scaleform UI: console, enchanting, naming, SkyUI search, MCM text fields EVERYTHING![/*]\n<br />[*]Laser pointer typing with sound feedback, haptics, and visual hover effects[/*]\n<br />[*]DONE button or grip to confirm  keyboard knows the difference between menus and free typing.[/*]\n<br />[/list]\n<br />\n<br />[center][b][color=#00bfff][size=4]OCU Keyboard Studio[/size][/color]\n<br />[/b]\n<br />[left][list]\n<br />[*][b][b][color=#efefef][size=3]OCU includes a separate visual keyboard-design application.[/size][/color]\n<br />[/b][/b][/*]\n<br />[/list][color=#efefef][size=3]Keyboard Studio allows users and mod authors to:[/size][/color]\n<br />\n<br />[list]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Move and resize keys, labels, controls, and input elements[/size][/color][/color][/*]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Import compatible TTF fonts[/size][/color][/color][/*]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Customize font, plate, outline, hover, and glow colors[/size][/color][/color][/*]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Add backgrounds, sprites, ribbons, and state-specific artwork[/size][/color][/color][/*]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Design separate PC/VR Mode, Lock/Unlock, and input-bar states[/size][/color][/color][/*]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Preview the keyboard before launching Skyrim VR[/size][/color][/color][/*]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Save complete portable .ocukb keyboard packages[/size][/color][/color][/*]\n<br />[*][color=#e4e4e7][color=#efefef][size=3]Install designs directly into OCU[/size][/color][/color][/*]\n<br />[*][b][color=#e4e4e7][color=#efefef][size=3]Package custom designs for MO2, Vortex, Wabbajack, or sharing designs with friends. [/size][/color][/color]\n<br />[/b][/*]\n<br />[/list][/left]\n<br />[/center]\n<br />[center][size=4][color=#00BFFF][b]SKSE Bridge Plugin[/b][/color][/size][/center]\n<br />[list]\n<br />[*]Hooks directly into Skyrim's text input system so the keyboard talks to the engine and Open Composite's API can effectively communicate seamlessly. [/*]\n<br />[*]YES it CAN search your items in AdditemSE.[/*]\n<br />[/list]\n<br />\n<br />[center][size=4][color=#00BFFF][b]Controller Combo Hotkeys[/b][/color][/size][/center]\n<br />[list]\n<br />[*]Map VR controller button combinations to keyboard scancode[/*]\n<br />[*]Supports press, double-tap, triple-tap, and long-press modes[/*]\n<br />[*]Up to 16 combos, fully configurable in the Configurator[/*]\n<br />[/list][center][b][color=#00bfff][size=4] Menu Lasers and custom controller inputs:[/size][/color][/b][/center]\n<br />[center][color=#efefef][b][size=4]OCU provides configurable dual-hand lasers for supported Scaleform menus and Prisma UI.[/size][/b]\n<br />[b][size=4]Features include:[/size][/b]\n<br />[/color]\n<br />[left][list]\n<br />[*][color=#efefef][size=3]Adjustable laser smoothing[/size][/color][/*]\n<br />[*][color=#efefef][size=3]Independent left and right aim calibration[/size][/color][/*]\n<br />[*][color=#efefef][size=3]Controller-position and rotation adjustments[/size][/color][/*]\n<br />[*][color=#efefef][size=3]Controller motion smoothing[/size][/color][/*]\n<br />[*][color=#efefef][size=3]Input-dropout protection[/size][/color][/*]\n<br />[*][color=#efefef][size=3]Independent stick dead zones[/size][/color][/*]\n<br />[*][color=#efefef][size=3]Optional stick swapping[/size][/color][/*]\n<br />[*][color=#efefef][size=3]Hand identity preservation when a runtime temporarily reports a sleeping controller. [/size][/color][/*]\n<br />[/list][/left]\n<br />[left][/left]\n<br />[color=#efefef][b][size=4]FOR MODDERS AND POWER USERS OCU PROVIDES FULL RANGE CONSOLE COMMAND SELECTION FOR IN GAME ASSETS. [/size][/b][/color][/center]\n<br />[center][/center]\n<br />[center][b][color=#00bfff][size=4]Gesture Casting[/size][/color][/b]\n<br />[left][list]\n<br />[*][color=#efefef]Draw custom one-hand or two-hand gestures and assign them to:[/color][/*]\n<br />[*]Keyboard keys[/*]\n<br />[*]Instant spell casting[/*]\n<br />[*]Equipping spells in either hand[/*]\n<br />[*]Gesture trails can be customized with separate colors, widths, sounds, and transparent, smoky, wispy, or glowing visual styles.[/*]\n<br />[/list][/left]\n<br />[/center]\n<br />[center][/center]\n<br />[center][b][color=#00BFFF][b][size=4]Full Key Rebinding[/size][/b][/color]\n<br />[/b][/center]\n<br />Full Keyboard and Controller Rebinding\n<br />[list]\n<br />[*]The Configurator provides visual editing of Skyrim VR’s controlmapvr.txt.[/*]\n<br />[*]Features include:[/*]\n<br />[*]Separate gameplay, menu, inventory, and other input contexts[/*]\n<br />[/list]Visual keyboard and controller assignment\n<br />[list]\n<br />[*]Quest Touch, Index Knuckles, and PSVR2 Sense controller artwork[/*]\n<br />[*]Included VRIK, VR Safe, Vanilla, and community presets[/*]\n<br />[/list] User-created controller presets\n<br />[list]\n<br />[*]Binding validation and repair for known crash-causing conflicts[/*]\n<br />[*]Reset to OCU VR Safe or original game defaults[/*]\n<br />[*]Controller Combo Hotkeys[/*]\n<br />[*]Map controller inputs to keyboard keys or Skyrim actions.[/*]\n<br />[*]Supported activation modes include:[/*]\n<br />[/list]- Single press\n<br />- Double tap\n<br />- Triple tap\n<br />- Quadruple tap\n<br />- Long press\n<br />- Multiple-button chords\n<br />\n<br />[center][size=4][color=#00BFFF][b]Standalone Configurator App[/b][/color][/size][/center]\n<br />[list]\n<br />[*]Dark-themed desktop app with two tabs: Settings and Keyboard/Controller Bindings[/*]\n<br />[*]Configure keyboard shortcut, display settings, audio, haptics, combos, and key rebinding[/*]\n<br />[*]Does NOT need to run through MO2 just put a shortcut on your desktop.[/*]\n<br />[/list][line]\n<br />\n<br />[center][size=5][color=#FFB428][b]~ What's In The Download ~[/b][/color][/size][/center]\n<br />\n<br />[list=1]\n<br />[*][color=#00BFFF][b]openvr_api.dll[/b][/color] (root folder) The core DLL. Replaces SteamVR's runtime. Handles all VR communication, rendering, keyboard overlay, combo detection, and settings.[/*]\n<br />[*][color=#00BFFF][b]OC Unleashed Configurator for Skyrim VR.exe[/b][/color] (mod folder)  Desktop configurator app. Leave EXE in you mod folder, place a shortcut on your desktop and run it directly when you need it.[/*]\n<br />[*][color=#00BFFF][b]OpenCompositeInput.dll[/b][/color] (SKSE/Plugins folder) SKSE plugin that bridges the VR keyboard with Skyrim's text input system.[/*]\n<br />[/list]\n<br />\n<br />[line]\n<br />\n<br />[center][size=5][color=#FFB428][b]~ Installation ~[/b][/color][/size][/center]\n<br />\n<br />[center][size=4][color=#00BFFF][b]MO2 (with Root Builder)[/b][/color][/size][/center]\n<br />[list=1]\n<br />[*]Install Root Builder if you don't have it[/*]\n<br />[*]If you have an older version of this mod or Open Composite, move it to a backup folder first[/*]\n<br />[*]Install this mod — MO2 + Root Builder will place the DLL in your game's root folder[/*]\n<br />[*]The SKSE plugin goes into SKSE/Plugins automatically[/*]\n<br />[*]Place a shortcut to the Configurator on your desktop[/*]\n<br />[/list]\n<br />\n<br />[center][size=4][color=#00BFFF][b]Vortex[/b][/color][/size][/center]\n<br />[list=1]\n<br />[*]Install and deploy as normal[/*]\n<br />[*]Make sure openvr_api.dll ends up in your SkyrimVR root folder[/*]\n<br />[*]OpenCompositeInput.dll should be in Data/SKSE/Plugins[/*]\n<br />[/list]\n<br />[line]\n<br />\n<br />[center][size=5][color=#FFB428][b]~ FAQ ~[/b][/color][/size][/center]\n<br />\n<br />[color=#00BFFF][b]Q: Do I still need SteamVR installed?[/b][/color]\n<br /> If using a Steam headset you must change OCU to your OpenXR runtime. \n<br />\n<br />[color=#00BFFF][b]Q: Will this work with Virtual Desktop / Air Link / ALVR?[/b][/color]\n<br />A: Yes. If you use Virtual Desktop, disable \"Audio Device Switching\" in the Configurator since Virtual Desktop handles its own audio.\n<br />\n<br />[color=#00BFFF][b]Q: How do I open the VR keyboard?[/b][/color]\n<br />A: Double-tap the left stick (default). You can change this to any button or combo in the Configurator.\n<br />\n<br />[color=#00BFFF][b]Q: Does it work with all menus?[/b][/color]\n<br />A: All common SkyUI menus work. Anything that runs Scaleform should work. Full Prisma UI functions in VR check out their Discord. \n<br />\n<br />[color=#00BFFF][b]Q: Will this hurt my save?[/b][/color]\n<br />A: It should not. The SKSE plugin only reads information from Skyrim to \"talk\" to OCU. No persistent data is written to your save. All settings are stored in text/ini files. That said, always keep backups.\n<br />\n<br />[color=#00BFFF][b]Q: Can I edit settings while the game is running?[/b][/color]\n<br />A: Keyboard settings reload automatically within about one second. Other settings require a restart.\n<br />\n<br />[line]\n<br />\n<br />[center][size=5][color=#FFB428][b]~ Credits ~[/b][/color][/size][/center]\n<br />The [b][color=#00ffff][size=4]Magnificent ColdBomb1[/size][/color][/b] for all his work, and merging our goals\n<br />\n<br />The absolute VR Dev legend [b][color=#00ff00][size=4]Mbucciha [/size][/color][/b]for his guidance on helping to improve open composite to work better with Open XR and Virtual Desktop\n<br />\n<br />Open Composite Unleashed would not exist without [url=https://github.com/yehorb/OpenComposite][color=#00BFFF]znixian, yehorb and the OpenComposite contributors[/color][/url]. They built the open-source OpenVR-to-OpenXR bridge that this project is built on. Their work is the engine underneath all of this.\n<br />\n<br />Special thanks to [color=#FFB428][b]Davey[/b][/color] (Skyrim VR testing) and [color=#FFB428][b]Relos1436[/b][/color] (Fallout 4 VR testing) for the hours of debugging, testing, and patience.\n<br />\n<br />[url=https://github.com/Wondernuttz/Open-Composite-Unleashed-for-Skyrim-VR][color=#00BFFF]Source code on GitHub[/color][/url] (GPL-3.0)\n<br />\n<br />[line]\n<br />\n<br />[center][size=3][color=#00ffff][i]We do this for free and for the love of VR gaming, and I always will.\n<br />If you want to show some love,[/i][/color][color=#C0C0C0][url=http://https://ko-fi.com/wondernutts]\n<br />[/url][url=https://buymeacoffee.com/coldbomb1f][color=#FFB428][b]support US on Ko-fi[/b][/color][/url]﻿﻿[url=YOUR_KOFI_LINK_HERE][/url][/color][/size][/center]\n<br />"
